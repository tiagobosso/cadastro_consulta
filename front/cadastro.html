<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Álbum</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Cadastro</div>
        <div class="menu">
            <a href="busca.html" class="link-menu">Ir para Busca</a>
            <button id="btn-sair" class="btn-sair">Sair</button>
        </div>
    </header>

    <main class="dashboard-container centralizado">
        <section class="card form-section">
            <h2>Cadastrar Novo Álbum</h2>
            <form id="form-album">
                <div class="input-group">
                    <label>Artista / Banda</label>
                    <input type="text" id="artista" required>
                </div>
                <div class="input-group">
                    <label>Nacionalidade</label>
                    <input type="text" id="nacionalidade">
                </div>
                <div class="input-group">
                    <label>Nome do Álbum</label>
                    <input type="text" id="nome_album" required>
                </div>
                <div class="input-group">
                    <label>Ano de Lançamento</label>
                    <input type="number" id="ano" required>
                </div>
                <button type="submit" class="btn">Salvar Álbum</button>
            </form>
        </section>
    </main>
    <script src="cadastro.js"></script>
</body>
</html>
