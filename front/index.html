<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="form-box" id="login-box">
            <h2>Bem-vindo de volta</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Seu E-mail" required>
                <input type="password" id="login-senha" placeholder="Sua Senha" required>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p>Não tem uma conta? <span class="toggle-link" onclick="toggleForms()">Cadastre-se</span></p>
        </div>

        <div class="form-box hidden" id="register-box">
            <h2>Criar Conta</h2>
            <form id="register-form">
                <input type="text" id="reg-nome" placeholder="Nome Completo" required>
                <input type="email" id="reg-email" placeholder="E-mail" required>
                <input type="password" id="reg-senha" placeholder="Senha" required>
                <button type="submit" class="btn">Cadastrar</button>
            </form>
            <p>Já tem uma conta? <span class="toggle-link" onclick="toggleForms()">Faça Login</span></p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
